name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck e test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Dipendenze
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Controllo dei tipi
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Installazione pulita (o4r init e doctor)
        env:
          OPIFER_HOME: ${{ runner.temp }}/opifer-home
        run: |
          pnpm o4r init --company "Azienda di prova" --no-color
          pnpm o4r doctor --no-color
