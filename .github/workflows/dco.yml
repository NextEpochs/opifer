name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signoff:
    name: Every commit is signed off
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e1147d1a8ff4e0d3ac9ee5e3e7a9ad1a2e2b6b # v5.0.0
        with:
          fetch-depth: 0
      - name: Check the Signed-off-by lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s), see CONTRIBUTING.md"
              missing=1
            fi
          done
          exit $missing
