# Opifer with Docker Compose: a single service, embedded database in the volume.
#   docker compose up -d
# Then open http://127.0.0.1:4700
services:
  opifer:
    build: .
    image: opifer:local
    ports:
      # Loopback only: version 0.1 has no authentication. Put a reverse proxy with access control in front to reach it from elsewhere.
      - "127.0.0.1:4700:4700"
    environment:
      OPIFER_COMPANY: "My company"
      # Authenticated mode with this owner (sign-in required): set both for a server.
      OPIFER_AUTH_EMAIL: ${OPIFER_AUTH_EMAIL:-}
      OPIFER_AUTH_PASSWORD: ${OPIFER_AUTH_PASSWORD:-}
      # Model provider keys (M1); from M2 they live in the encrypted vault.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ChatGPT subscription instead of an API key:
      #   docker compose exec opifer node packages/cli/dist/main.js login chatgpt --manual
    volumes:
      - opifer-data:/data
    restart: unless-stopped

volumes:
  opifer-data:
