<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Opifer: AI agents that work, learn and are governed like an organisation">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F1F1F6" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0A0A0F"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <ellipse cx="600" cy="150" rx="520" ry="160" fill="url(#glow)"/>
  <g transform="translate(120 96)">
    <rect width="108" height="108" rx="28" fill="url(#violet)"/>
    <text x="54" y="78" text-anchor="middle" font-family="'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#F1F1F6">O</text>
  </g>
  <text x="260" y="150" font-family="'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#F1F1F6" letter-spacing="-2">Opifer</text>
  <text x="264" y="198" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8888A0">AI agents that work, learn and are governed like an organisation.</text>
  <g font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8888A0">
    <rect x="264" y="222" width="136" height="30" rx="8" fill="#14141E" stroke="#7C3AED" stroke-opacity="0.5"/>
    <text x="332" y="242" text-anchor="middle" fill="#A855F7">governed</text>
    <rect x="410" y="222" width="126" height="30" rx="8" fill="#14141E" stroke="#06B6D4" stroke-opacity="0.5"/>
    <text x="473" y="242" text-anchor="middle" fill="#06B6D4">learning</text>
    <rect x="546" y="222" width="150" height="30" rx="8" fill="#14141E" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="621" y="242" text-anchor="middle" fill="#10B981">self-hosted</text>
    <rect x="706" y="222" width="130" height="30" rx="8" fill="#14141E" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="771" y="242" text-anchor="middle" fill="#FBBF24">one install</text>
  </g>
</svg>
